# auditus.conf — DeusRidet Auditus (speaker diarization) runtime knobs
#
# Format: key=value (one per line, # = comment)
# Loaded by `awaken` just before AudioPipeline::start(). All keys are
# optional — omitted keys fall back to the AudioPipelineConfig defaults
# compiled into audio_pipeline.h. Editing this file requires ONLY a
# process restart (no rebuild).
#
# Philosophical role:
#   Knowing WHEN WHO is speaking is the foundational signal for a
#   conscious agent. This file is the operator's panel for tuning that
#   signal — separated from code so iteration on thresholds does not
#   pollute git history with mechanical parameter sweeps.

# ============================================================================
# Match / Register thresholds (the two primary decision gates)
# ============================================================================
# Cosine similarity threshold for matching a query embedding to an existing
# speaker in the 384D dual-encoder DB (CAM++ 192D || WL-ECAPA 192D).
# Lower -> more matches (more merges). Higher -> more unknowns.
#
# 2026-05-27: Step 3 tried 0.50 -> 0.45 to recover id=-1 abstain mass.
# Live result: 29.5% -> 29.2% (Δ = -0.3 pp). 徐子景 +14.1 pp but
# 朱杰 -6.2 pp; the trade is bidirectional and net slightly negative.
# Reverted to 0.50.
speaker_threshold = 0.50

# Cosine similarity threshold for confirming a new speaker from the
# pending pool (a query must pair with a prior pending query at this
# similarity to be accepted as a new identity). Lower -> faster cold-start
# registration, more false splits. Higher -> slower cold-start, fewer
# false splits.
speaker_register_threshold = 0.60

# ============================================================================
# Discovery phase (cold-start separation)
# ============================================================================
# Number of end-of-segment FULL extractions treated as "discovery".
# During this window, match_thresh is boosted to force new speakers
# apart instead of absorbing similar voices into spk0. Recency gating
# is also disabled during this window (see below).
speaker_discovery_count = 50

# Additive boost applied to match_thresh during discovery. 0.07 means
# a discovery-phase match requires sim >= 0.57 (instead of 0.50).
#
# 2026-05-27: Step 2 reverts 0.10 -> 0.07 (in-code default). The 0.10
# value was a fixture-tuned override.
speaker_discovery_boost = 0.07

# Subtractive relaxation applied to speaker_register_threshold during the
# discovery window. 0.07 makes the effective pending confirmation threshold
# 0.53 (0.60 - 0.07) during cold-start.
#
# 2026-05-27: Step 2 reverts 0.16 -> 0.07 (in-code default). The 0.16
# value was a fixture-tuned override that may have caused over-eager
# cold-start spawning (4 real speakers but db ended up with 8 ids).
speaker_discovery_reg_relax = 0.07

# ============================================================================
# Recency stabilizer (post-discovery only)
# ============================================================================
# Time window (in source-audio seconds) during which the previously
# identified speaker is considered "still active"; within this window
# match_thresh is lowered by recency_bonus and auto_reg is disabled.
speaker_recency_window_sec = 15.0

# Amount match_thresh is lowered by when recency is active. Too large
# -> false merges across speaker boundaries; too small -> useless.
#
# 2026-05-27: Step 4 zeros this out. The recency bonus systematically
# biases borderline matches toward whichever id was last active,
# which is the suspected source of catch-all absorption (raw=7 in
# the OFF_baseline stole 112s/21s/36s from the three smaller speakers).
speaker_recency_bonus = 0.00

# ============================================================================
# Ambiguity / safety gates
# ============================================================================
# Minimum margin (top-1 sim - top-2 sim) required to trust a match.
# Below this, the pipeline abstains (emits unidentified) and the FULL
# embedding is routed to the pending pool instead of being EMA-blended
# into a possibly-wrong cluster. Step 16f root-cause analysis on
# RUN4 of the 16e verification showed 徐子景 @ts=320s being absorbed
# into cluster 0 (朱杰) at sim=0.666 / margin=0.063 — the margin was
# just above 0.05, so the match was accepted and 徐 never got her own
# cluster. Raising to 0.10 closes that crack: ambiguous matches (low
# margin regardless of absolute sim) are deferred to pending-pool
# logic, which is structurally more cautious about committing.
#
# 2026-05-27: Step 1 of the accuracy-first plan reverts this to 0.05
# (the in-code default). The Step 16f bump to 0.10 was justified by a
# single fixture anecdote; under the live-system rule we measure the
# effect on tests/test.mp3 directly.
speaker_margin_abstain = 0.05

# After this many FULL extractions, auto-register is disabled
# globally — drift-clones observed historically at count >= 180.
speaker_max_auto_reg_count = 1000

# ============================================================================
# Segment-length gate
# ============================================================================
# Minimum accumulated fbank frames (10 ms hop) before CAM++ FULL
# extraction runs on a closed speech segment. Segments shorter than
# this are dropped entirely: no embedding, no identity, no registration.
# Default 150 (~1.5 s) matches the long-standing hardcoded value.
# Lowering this (e.g. to 50) was tested in Step 4b and REGRESSED
# macro accuracy on a 4-speaker 600 s capture from 0.281 to 0.200:
# short-segment embeddings are noisier and the runtime EMA-updates
# cluster centroids on every decided hit, so flooding the library
# with short-segment rescues polluted existing centroids enough that
# two legitimate newcomers never crossed speaker_register_threshold.
# Keep at 150 unless you also redesign the library-update policy
# (e.g. weight short-segment contributions less, or gate registration
# on per-segment confidence rather than a single similarity pass).
speaker_min_fbank_frames = 150

# ============================================================================
# Short-segment inheritance broadcast
# ============================================================================
# When a speech segment ends too short to run CAM++ FULL (fewer than
# speaker_min_fbank_frames frames), the VAD-start hook has typically
# already populated stats_.speaker_id from the previous segment under
# a strict 0.8 s gap gate (SAAS_INHERIT). With this flag ON, the
# segment-end path emits that inherited identity as a speaker broadcast
# so downstream consumers (WebUI, scorers) get coverage on short
# backchannels / fillers / continuations. The speaker library is
# NEVER touched (no identify, no register, no EMA, no exemplar add) —
# this is a pure continuity hint. Set to 0 to disable entirely.
speaker_short_inherit_enable = 1

# ============================================================================
# Step 19b — Short-segment IDENTIFY-ONLY rescue
# ============================================================================
# Empirical (devlog 2026-05-22): 54.5% of all-GT segments are isolated
# speech with VAD duration 0.5–1.5 s, which falls below
# speaker_min_fbank_frames=150 (1.5 s) and never reaches the FULL CAM++
# identify path. Sub-segment diarization was empirically shown to be a
# low-leverage path (~11% upper bound).
#
# With this flag ON and a segment in the band
# [speaker_min_fbank_frames_identify, speaker_min_fbank_frames),
# the encoder still extracts the embedding and scores it against the
# existing speaker store via SpeakerVectorStore::peek_best — i.e.
# READ-ONLY cosine search, NO register, NO EMA, NO pending, NO exemplar
# admission. If the best cluster similarity passes speaker_threshold,
# the identity is broadcast as a normal speaker event. Otherwise the
# path falls through to the SAAS_INHERIT broadcast as before.
#
# This avoids the Step 4b regression (centroid pollution by noisy
# short-segment embeddings) because the speaker library is never
# written by this path — only existing clusters can be matched. New
# speakers in short segments will still abstain.
#
# Default: 0 (off) — enable as an experiment.
# 50 fbank frames ≈ 500 ms at 16 kHz / 10 ms hop.
#
# r1/r2/r3 sweep result (devlog 2026-05-22):
#   r1: thr=0.50 mar=0.00 → coverage 87.4% / dec_macro 0.310 (dominant-absorb: 石一→0.000, 7/9 clusters→朱杰)
#   r2: thr=0.65 mar=0.05 → coverage 27.3% / dec_macro 0.842 (+2 decides over baseline only)
#   r3: thr=0.55 mar=0.03 → coverage 87.9% / dec_macro 0.256 (worse than r1; 9→3 names)
# The threshold landscape WAS binary because SHORT-IDENTIFY hits used
# to seed prev_seg_speaker_id_, feeding the INHERIT-BROADCAST chain.
# One wrong SI label cascaded into ~10 wrong inherited labels.
#
# === Step 19d (devlog 2026-05-23): two-stage breakthrough =============
# (a) MULTI-GATE (Step 19c) cleans centroids by routing mixed-speaker
#     VADs to peek_best instead of admitting noisy exemplars.
# (b) SHORT-IDENTIFY hits now label ONLY their own segment — they no
#     longer touch prev_seg_speaker_id_. The cascade is decoupled,
#     so a wrong SI label costs 1 decision instead of ~10.
# Sweep on the same 10-min apples-to-apples replay (MULTI-GATE locked):
#   baseline (SI OFF) : cov=0.293  dec_macro=0.949
#   thr=0.55 m=0.05   : cov=0.369  dec_macro=0.945  (+8 SI matches)
#   thr=0.50 m=0.05   : cov=0.394  dec_macro=0.958  (+24)
#   thr=0.45 m=0.05   : cov=0.409  dec_macro=0.951  (+33)
#   thr=0.40 m=0.05   : cov=0.475  dec_macro=0.956  (+43)  ← shipped
#   thr=0.35 m=0.05   : cov=0.475  dec_macro=0.938  (saturates / regresses)
# Net Step 19c+19d delta vs pre-19c baseline:
#   coverage 0.253 → 0.475 (+22.2 pts), dec_macro 0.854 → 0.956 (+10.2 pts).
speaker_short_identify_enable     = 1
speaker_min_fbank_frames_identify = 50
speaker_short_identify_threshold  = 0.40
speaker_short_identify_margin     = 0.05

# === Step 19c: VAD-internal multi-speaker probe gate ==================
# When ON, the FULL extraction first runs a sliding CAM++ cosine probe
# over seg_fbank_buf_ (1.5 s window, 0.5 s hop). If the minimum
# adjacent-window cosine falls below speaker_multi_gate_threshold, the
# VAD is treated as multi-speaker and the identify path switches to
# peek_best — best-effort label, no exemplar admission, no
# auto-register, no EMA. Skipped on VADs shorter than min_fbank
# (need >=2 windows; default 250 ≈ 2.5 s).
#
# Empirical (devlog 2026-05-22, tools/eval_changepoint_binary.py):
#   AUC=0.819 on 47 long VADs. At thr=0.58 prec=1.000/rec=0.375 (zero
#   false positives on truly single-speaker VADs). At thr=0.60
#   prec=0.800/rec=0.500.
#
# Hypothesis: protecting cluster centroids from mixed-speaker
# exemplars should let non-dominant speakers' clusters retain
# discriminative power and lift coverage on subsequent FULL/SHORT
# decisions for those speakers.
#
# Verdict (devlog 2026-05-22, 10-min apples-to-apples A/B):
#   baseline (gate=OFF) : coverage=0.253  dec_macro=0.854
#                         per_spk_decided{唐云峰:0.625, 徐子景:0.917,
#                                         朱杰:0.875, 石一:1.000}
#   gate=ON  thr=0.58   : coverage=0.293  dec_macro=0.949  (+4 pts / +9.4 pts)
#                         per_spk_decided{唐云峰:0.938, 徐子景:0.929,
#                                         朱杰:0.929, 石一:1.000}
#                         3 gate firings over 10 min, each blocked
#                         a centroid-polluting exemplar.
#   gate=ON  thr=0.60   : coverage=0.288  dec_macro=0.948
#   Default: enable=1 thr=0.58 (matches zero-FP operating point).
speaker_multi_gate_enable         = 1
speaker_multi_gate_threshold      = 0.58
speaker_multi_gate_min_fbank      = 250

# Step 21 — SHORT-IDENTIFY → prev_full recency refresh (SHIPPED Step 22).
# When a SHORT-IDENTIFY match >= this similarity, the matched identity
# refreshes prev_full so the inherit-recency window (4 s) restarts.
# 0.0 disables (= Step 20 behaviour).
#
# Default 0.60 — Step 22 re-evaluation on the 1800 s slice of
# tests/test.mp3 (571 GT segs, replay 1x) gave a clean 4σ result:
#   baseline (thr=0.0)  run1 cov=0.538 dec_macro=0.790
#                       run2 cov=0.559 dec_macro=0.822
#   thr=0.60            run1 cov=0.627 dec_macro=0.783
#                       run2 cov=0.631 dec_macro=0.785
#   Δcov = +0.081, Δmacro = +0.034, Δdec_macro = -0.022.
# Within-config noise (Δcov=0.0035 at thr=0.60) is dwarfed by the
# between-config gap; coverage gain dominates the dec_macro cost.
# Margin gate (speaker_short_identify_margin >= 0.05) already filters
# absorb-into-dominant on the SI side. Env DEUSRIDET_SI_REFRESH_PREVFULL_THR
# overrides for sweeps (set to 0.0 to disable).
speaker_si_refresh_prev_full_threshold = 0.60

# ----------------------------------------------------------------------
# Step 23 — SHORT-IDENTIFY WL-ECAPA tile-padding (EXPERIMENTAL, default OFF).
# Diagnostic on the 1800 s reference fixture (Step 22 thr=0.60 run):
#   SI-match=120  SI-abstain=68  SI-skip(WL empty, samples<16000)=223
# The 223 SI-skip events are the largest single source of lost short-band
# identifications. Tile-padding (looping actual speech up to 16000)
# preserves stat-pool moments — *but* the 1800 s ablation showed it
# does not improve macro outside noise at any floor:
#   baseline pooled 3-run:  cov=0.620 σ=0.013, macro=0.46
#   tile-pad 8k  (factor≤2×) 2-run: cov=0.628 σ=0.022, macro=0.481
#   tile-pad 12k (factor≤1.33×) 1-run: cov=0.613, macro=0.459
# The 8k floor doubles σ (periodicity artefact in ECAPA stats); 12k
# floor recovers too few (~25 of 223) to move the needle. Proper fix
# for the 223 skip reservoir requires a short-segment speaker encoder
# (deferred RFC). The knob is kept as default-OFF scaffolding.
# Env DEUSRIDET_SI_WL_TILE_PAD = {0,1} overrides for further sweeps.
speaker_si_wl_tile_pad_enable = 0

# Step 24 — CAM++ shadow store for SI-skip-wl fallback (default ON).
# 1800 s diagnostic showed 76% (82/108) of no_segment GTs involve a
# "SI-skip-wl" event: samples<16000 → WL-ECAPA empty → SI band skips
# entirely. Tile-padding (Step 23) was the wrong fix.
# Correct fix: in dual-encoder mode, every confirmed FULL admission
# mirrors the 192-D CAM++ vector into campp_db_ under the SAME
# external_id as dual_db_. When SI hits a samples<16000 segment, it
# queries campp_db_.peek_best(si_emb) and emits a short-identify event
# at the standard SI threshold/margin gates. ID space is unified, so
# downstream label consumers need no remapping. The shadow store has
# no admit gates — accumulates ~one exemplar per FULL admission.
# Disable to bypass the fallback path entirely.
speaker_campp_shadow_enable = 1

# Step 24-b: separate gates for the CAM++ shadow path. The default
# SI threshold (0.40) and margin (0.05) were tuned for the dual
# 384-D encoder. The single-encoder 192-D CAM++ shadow has weaker
# discrimination, so reusing those gates lets in too many weak
# matches (Step 24 sweep: median shadow sim 0.443, ~45 % accuracy
# on new shadow decisions vs ~78 % full-pool baseline). The shadow
# path applies its own (tighter) threshold + margin so recovered
# decisions are at least as trustworthy as the dual baseline.
# Set <= 0 to disable each gate independently.
speaker_campp_shadow_threshold = 0.48
speaker_campp_shadow_margin    = 0.10

# Step 25a: SI-peek-veto on INHERIT-BROADCAST.
# Diagnostic on Step 24-b r2 (382 decided, dec_macro=0.788) showed
# inherit-broadcasts account for 83 % of all wrong decisions, while
# the SHORT-IDENTIFY peek — even when it abstained — often has the
# correct opinion. When SI ran but abstained AND its peek had a
# CONFIDENT DIFFERENT opinion from the prev_seg/prev_full inherit
# identity, the inherit is suppressed (segment becomes no_segment)
# rather than emit a likely-wrong label.
# Conservative default 0.45: only veto when peek's confidence
# comfortably exceeds the noise baseline. Set to 0 to disable.
# DEFAULT OFF: Step 25 negative result — 3-run mean macro 0.481 vs
# 24-b baseline 0.487, within sigma. Veto fires too rarely (~8 / 1800s)
# to move macro; only dec_macro is mildly affected. Knob retained for
# opt-in experimentation.
speaker_inherit_peek_veto_enable    = 0
speaker_inherit_peek_veto_threshold = 0.45

# Step 25b: SI-peek RESCUE on INHERIT-BROADCAST. When the veto would
# fire (peek confidently disagrees), substitute peek's identity as the
# broadcast label instead of dropping it. Converts wrong inherits into
# correct decisions (lifts both macro and dec_macro). Requires
# speaker_inherit_peek_veto_enable=1.
# Step 25b：当 veto 触发时，用 peek 的身份替换 inherit 身份并广播，
# 把错误 inherit 转为正确决策（同时提升 macro 与 dec_macro）。
# DEFAULT OFF: r1+r2 实测 run-to-run 方差过大（cov 0.553 vs 0.657，
# dec_macro 0.848 vs 0.780），且 2-run 均值 macro 反而回退；
# 保留为可选诊断旋钮，缺省关闭。
speaker_inherit_peek_rescue_enable  = 0
