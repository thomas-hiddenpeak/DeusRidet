# auditus.conf — DeusRidet Auditus (speaker diarization) runtime knobs
#
# Format: key=value (one per line, # = comment)
# Loaded by `awaken` just before AudioPipeline::start(). All keys are
# optional — omitted keys fall back to the AudioPipelineConfig defaults
# compiled into audio_pipeline.h. Editing this file requires ONLY a
# process restart (no rebuild).
#
# Philosophical role:
#   Knowing WHEN WHO is speaking is the foundational signal for a
#   conscious agent. This file is the operator's panel for tuning that
#   signal — separated from code so iteration on thresholds does not
#   pollute git history with mechanical parameter sweeps.

# ============================================================================
# Match / Register thresholds (the two primary decision gates)
# ============================================================================
# Cosine similarity threshold for matching a query embedding to an existing
# speaker in the 384D dual-encoder DB (CAM++ 192D || WL-ECAPA 192D).
# Lower -> more matches (more merges). Higher -> more unknowns.
#
# 2026-05-27: Step 3 tried 0.50 -> 0.45 to recover id=-1 abstain mass.
# Live result: 29.5% -> 29.2% (Δ = -0.3 pp). 徐子景 +14.1 pp but
# 朱杰 -6.2 pp; the trade is bidirectional and net slightly negative.
# Reverted to 0.50.
speaker_threshold = 0.50

# Cosine similarity threshold for confirming a new speaker from the
# pending pool (a query must pair with a prior pending query at this
# similarity to be accepted as a new identity). Lower -> faster cold-start
# registration, more false splits. Higher -> slower cold-start, fewer
# false splits.
#
# 2026-05-27: Step 5 tried 0.60 -> 0.65 (tighter spawn). Live result
# 30.7% -> 30.6%, noise level. Reverted.
speaker_register_threshold = 0.60

# ============================================================================
# Ambiguity / safety gates
# ============================================================================
# Minimum margin (top-1 sim - top-2 sim) required to trust a match.
# Below this, the pipeline abstains (emits unidentified) and the FULL
# embedding is routed to the pending pool instead of being EMA-blended
# into a possibly-wrong cluster. Step 16f root-cause analysis on
# RUN4 of the 16e verification showed 徐子景 @ts=320s being absorbed
# into cluster 0 (朱杰) at sim=0.666 / margin=0.063 — the margin was
# just above 0.05, so the match was accepted and 徐 never got her own
# cluster. Raising to 0.10 closes that crack: ambiguous matches (low
# margin regardless of absolute sim) are deferred to pending-pool
# logic, which is structurally more cautious about committing.
#
# 2026-05-27: Step 1 of the accuracy-first plan reverts this to 0.05
# (the in-code default). The Step 16f bump to 0.10 was justified by a
# single fixture anecdote; under the live-system rule we measure the
# effect on tests/test.mp3 directly.
#
# 2026-05-27: Step 6 lowers further 0.05 -> 0.00 (gate fully off) to
# extend the Step 1 loosening trend.
#
# 2026-06-XX: restored to 0.10. The Step 6 = 0.00 setting was a
# fixture-only sweep result (⚠️ unverified per workflow rule). Live
# `awaken` testing surfaced the failure it predicts: a NEW speaker with
# clearly different timbre, scoring >= match_floor (0.50) against an
# already-LABELLED speaker's centroid with a near-tied runner-up, was
# broadcast as that known speaker instead of abstaining to unknown.
# With the margin gate off (0.00) the ambiguity guard never fires, so
# any top-1 above the floor wins. 0.10 re-arms the guard: ambiguous
# matches (top1-top2 < 0.10) abstain and defer to the offline finalize.
# This knob is now also runtime-tunable live (WS: speaker_margin_abstain:<v>,
# dev console slider) so the value can be exercised without a restart.
speaker_margin_abstain = 0.10

# ============================================================================
# Segment-length gate
# ============================================================================
# Minimum accumulated fbank frames (10 ms hop) before CAM++ FULL
# extraction runs on a closed speech segment. Segments shorter than
# this are dropped entirely: no embedding, no identity, no registration.
# Default 150 (~1.5 s) matches the long-standing hardcoded value.
# Lowering this (e.g. to 50) was tested in Step 4b and REGRESSED
# macro accuracy on a 4-speaker 600 s capture from 0.281 to 0.200:
# short-segment embeddings are noisier and the runtime EMA-updates
# cluster centroids on every decided hit, so flooding the library
# with short-segment rescues polluted existing centroids enough that
# two legitimate newcomers never crossed speaker_register_threshold.
# Keep at 150 unless you also redesign the library-update policy
# (e.g. weight short-segment contributions less, or gate registration
# on per-segment confidence rather than a single similarity pass).
speaker_min_fbank_frames = 150

# (2026-06-02 anti-entropy) The pre-redesign discovery / recency /
# short-inherit / short-identify / multi-gate / si-refresh / campp-shadow /
# inherit-peek knobs were removed: the clean three-concern online facade
# (orator_online) consumes only the four gates above. Old values remain in
# git history if a sweep ever needs them.

# ============================================================================
# Hybrid P2 timing knobs
# ============================================================================
# Periodic DiariZen pass cadence in seconds.
diarizen_period_sec = 30

# How long a transcript remains mutable before commit to Conscientia.
transcript_holdback_sec = 75

# Sliding window for live periodic diarize. Finalize still uses full session.
diarizen_window_sec = 120

# Enable periodic passes by default. When off, manual trigger/finalize still work.
diarizen_periodic_enabled = true
