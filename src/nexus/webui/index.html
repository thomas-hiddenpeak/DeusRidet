<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>DeusRidet</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components/components.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title"><span data-role="title">DeusRidet</span><span class="app__entity" data-role="entity"></span></h1>
      <span class="app__spacer"></span>
      <div class="app__top" data-slot="top"></div>
      <span class="conn conn--off" data-role="conn">
        <span class="conn__dot" aria-hidden="true"></span>
        <span data-role="conn-label"></span>
      </span>
      <button type="button" class="lang" data-role="lang">中文</button>
    </header>

    <div class="app__strips" data-slot="strips"></div>

    <section class="app__stream" data-slot="stream" aria-label="Conversation"></section>

    <footer class="app__composer" data-slot="composer"></footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
